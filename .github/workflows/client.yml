name: Client TLS

on:
  push:
    branches:
      - "client/**"
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: Build, the pin and the streams on the loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt install -y cmake git pkg-config libssl-dev ninja-build gcc g++ python3-pip
          pip3 install meson

      - name: Build as the release does
        run: |
          meson setup -Db_lto=true --buildtype=release --warnlevel=0 -Ddefault_library=static meson-build-release
          ninja -C meson-build-release

      - name: The pin code without warnings
        working-directory: meson-build-release
        run: |
          command=$(jq -r '.[] | select(.file | endswith("slipstream_pin.c")) | .command' compile_commands.json)
          test -n "$command"
          # only this file's own lines: the headers of picoquic and picotls are not ours
          eval "$command -Wall -Wextra -fsyntax-only" 2>&1 | tee warnings.txt
          ! grep -E "slipstream_pin\.c:[0-9]+:[0-9]+: (warning|error)" warnings.txt

      - name: The pin and the streams on the loopback
        run: python3 .github/scripts/client_pin_test.py meson-build-release
